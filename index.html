<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MTCA 2026 Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="app">
    <div class="sticky-top">
      <header>
        <h1>MTCA 2026</h1>
        <div class="subtitle">Musical Theater Competition</div>
      </header>

      <!-- Tab Navigation -->
      <nav class="tab-bar">
        <button class="tab-btn" data-tab="schedule">Schedule</button>
        <button class="tab-btn active" data-tab="awards">Awards</button>
      </nav>
    </div>

    <!-- Add Session Modal -->
    <div id="add-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add Session</h2>
          <button class="close-btn" data-close="add-modal">&times;</button>
        </div>
        <div class="modal-body">
            <label for="manual-title">Title</label>
            <input type="text" id="manual-title" placeholder="Session title">
            <label for="manual-date">Date</label>
            <input type="date" id="manual-date">
            <div class="time-row">
              <div>
                <label for="manual-start">Start</label>
                <input type="time" id="manual-start">
              </div>
              <div>
                <label for="manual-end">End</label>
                <input type="time" id="manual-end">
              </div>
            </div>
            <label for="manual-location">Location</label>
            <input type="text" id="manual-location" placeholder="Room / Hall">
            <label for="manual-speaker">Speaker</label>
            <input type="text" id="manual-speaker" placeholder="Speaker name">
            <label for="manual-notes">Notes</label>
            <textarea id="manual-notes" rows="2" placeholder="Optional notes"></textarea>
            <button id="manual-add-btn" class="btn primary">Add Session</button>
        </div>
      </div>
    </div>

    <!-- Edit Session Modal -->
    <div id="edit-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Edit Session</h2>
          <button class="close-btn" data-close="edit-modal">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title">
          <label for="edit-date">Date</label>
          <input type="date" id="edit-date">
          <div class="time-row">
            <div>
              <label for="edit-start">Start</label>
              <input type="time" id="edit-start">
            </div>
            <div>
              <label for="edit-end">End</label>
              <input type="time" id="edit-end">
            </div>
          </div>
          <label for="edit-location">Location</label>
          <input type="text" id="edit-location">
          <label for="edit-speaker">Speaker</label>
          <input type="text" id="edit-speaker">
          <label for="edit-notes">Notes</label>
          <textarea id="edit-notes" rows="2"></textarea>
          <div class="edit-actions">
            <button id="edit-save-btn" class="btn primary">Save Changes</button>
            <button id="edit-delete-btn" class="btn danger">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <main>
      <!-- Schedule Tab -->
      <div id="tab-schedule" class="tab-panel">
        <div class="toolbar">
          <div class="day-filter" id="day-filter">
            <button class="day-btn active" data-day="all">All</button>
          </div>
          <button id="add-btn" class="btn primary fab" title="Add Session" aria-label="Add session">+</button>
        </div>
        <div id="schedule-list" class="schedule-list">
          <div class="empty-state" id="empty-state">
            <div class="theater-icon">&#127917;</div>
            <p>The stage is empty.</p>
            <p>Tap <strong>+</strong> to add a performance.</p>
          </div>
        </div>
      </div>

      <!-- Awards Tab -->
      <div id="tab-awards" class="tab-panel active">
        <div id="awards-list" class="awards-list"></div>
      </div>
    </main>
  </div>

  <script src="schedule-data2.js?v=2"></script>
  <script src="awards.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
